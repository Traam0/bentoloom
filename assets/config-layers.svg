<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1104 250" width="1104" height="250" role="img" aria-label="Config resolution order: defaults, generator defaults, per-call overrides"><title>Config resolution order: defaults, generator defaults, per-call overrides</title><defs><linearGradient id="p0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4b9a4"/><stop offset="1" stop-color="#d29f8d"/></linearGradient><linearGradient id="p1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fd3c7"/><stop offset="1" stop-color="#89b5ab"/></linearGradient><linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d58e"/><stop offset="1" stop-color="#d4b77a"/></linearGradient><linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8c4f0"/><stop offset="1" stop-color="#9ea9ce"/></linearGradient><linearGradient id="p4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e9a8c1"/><stop offset="1" stop-color="#c890a6"/></linearGradient><linearGradient id="p5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a8d5a2"/><stop offset="1" stop-color="#90b78b"/></linearGradient><linearGradient id="p6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0c4a0"/><stop offset="1" stop-color="#cea98a"/></linearGradient><linearGradient id="p7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9cc3e6"/><stop offset="1" stop-color="#86a8c6"/></linearGradient></defs><rect width="1104" height="250" rx="22" fill="#fbf8f3" stroke="#e7dfd2"/><rect x="36" y="34" width="222" height="110" rx="18" fill="#fffdf9" stroke="#e7dfd2"/><text x="147" y="68" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="16" font-weight="700" fill="#2b2a28" text-anchor="middle">Built-in defaults</text><text x="147" y="96" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#1f5f54" text-anchor="middle">DEFAULT_CONFIG</text><text x="147" y="122" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" font-weight="400" fill="#78716c" text-anchor="middle">frozen · always safe</text><path d="M270 89h24m-8 -7l8 7-8 7" stroke="#78716c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="306" y="34" width="222" height="110" rx="18" fill="#fffdf9" stroke="#e7dfd2"/><text x="417" y="68" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="16" font-weight="700" fill="#2b2a28" text-anchor="middle">Your project defaults</text><text x="417" y="96" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#1f5f54" text-anchor="middle">createLayoutGenerator({…})</text><text x="417" y="122" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" font-weight="400" fill="#78716c" text-anchor="middle">set once, reuse everywhere</text><path d="M540 89h24m-8 -7l8 7-8 7" stroke="#78716c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="576" y="34" width="222" height="110" rx="18" fill="#fffdf9" stroke="#e7dfd2"/><text x="687" y="68" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="16" font-weight="700" fill="#2b2a28" text-anchor="middle">Per call</text><text x="687" y="96" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#1f5f54" text-anchor="middle">generate(items, { config })</text><text x="687" y="122" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" font-weight="400" fill="#78716c" text-anchor="middle">one-off override</text><path d="M810 89h24m-8 -7l8 7-8 7" stroke="#78716c" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="846" y="34" width="222" height="110" rx="18" fill="#1f5f54" stroke="#1f5f54"/><text x="957" y="68" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Resolved config</text><text x="957" y="96" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="12.5" font-weight="400" fill="#d6ebe5" text-anchor="middle">validated copy</text><text x="957" y="122" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="12.5" font-weight="400" fill="#ffffffcc" text-anchor="middle">or LayoutConfigError</text><rect x="36" y="178" width="178" height="32" rx="16" fill="#f3eee4" stroke="#e7dfd2"/><text x="125" y="199" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#2b2a28" text-anchor="middle">objects merge deeply</text><rect x="228" y="178" width="170.6" height="32" rx="16" fill="#f3eee4" stroke="#e7dfd2"/><text x="313.3" y="199" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#2b2a28" text-anchor="middle">arrays are replaced</text><rect x="412.6" y="178" width="252" height="32" rx="16" fill="#f3eee4" stroke="#e7dfd2"/><text x="538.6" y="199" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#2b2a28" text-anchor="middle">shapes.add / remove accumulate</text><rect x="678.6" y="178" width="148.4" height="32" rx="16" fill="#f3eee4" stroke="#e7dfd2"/><text x="752.8" y="199" font-family='ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' font-size="13" font-weight="600" fill="#2b2a28" text-anchor="middle">later layers win</text></svg>
